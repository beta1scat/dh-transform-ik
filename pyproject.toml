[project]
name = "dh-transform-ik"
version = "1.0.0"
description = "A general framework for the analytical inverse kinematics solution of 6-DOF industrial robots"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
]

[dependency-groups]
benchmark = [
    "numpy<2",
    "roboticstoolbox-python>=1.0",
    "spatialmath-python>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
